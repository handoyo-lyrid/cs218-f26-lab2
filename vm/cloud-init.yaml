#cloud-config
# CS 218 Lab 2: turns a fresh Ubuntu 24.04 VM into the other half of the comparison.
#
# This is the TEMPLATE. `python lab.py render` embeds app/app.py into it and writes
# vm/cloud-init.yaml, which is the file you hand to your hypervisor. The embedded copy is
# how the VM runs the byte-identical program your container runs.

users:
  - default
  - name: lab2
    system: true
    shell: /usr/sbin/nologin

write_files:
  - path: /opt/lab2/app.py
    permissions: "0644"
    encoding: b64
    content: 

  - path: /etc/systemd/system/lab2.service
    content: |
      [Unit]
      Description=CS 218 Lab 2 workload
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=lab2
      ExecStart=/usr/bin/python3 /opt/lab2/app.py
      Restart=always

      [Install]
      WantedBy=multi-user.target

  # Part 3 crashes this VM's kernel on purpose. The helper refuses to run unless this
  # marker exists, and the marker exists only inside the Lab 2 VM, so running the command
  # on your own laptop by mistake does nothing but print a refusal.
  - path: /etc/cs218-lab2-vm
    content: |
      This machine is the CS 218 Lab 2 VM.

  - path: /usr/local/sbin/lab2-panic
    permissions: "0755"
    content: |
      #!/bin/sh
      if [ ! -f /etc/cs218-lab2-vm ]; then
        echo "refusing: this is not the CS 218 Lab 2 VM" >&2
        exit 1
      fi
      if [ "$(id -u)" != 0 ]; then
        echo "lab2-panic needs root: run it with sudo" >&2
        exit 1
      fi
      echo "crashing this VM's kernel now; it reboots itself about 10 seconds later" >&2
      sync
      echo c > /proc/sysrq-trigger

  # By default a panicked kernel can sit halted forever. This makes it reboot itself.
  - path: /etc/sysctl.d/90-cs218-lab2.conf
    content: |
      kernel.panic = 10

runcmd:
  - [sysctl, --system]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, lab2.service]
